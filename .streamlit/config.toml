# Look and feel of the dashboard: one light theme (user's choice, 22 Oct 2026).

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#3B5BDB"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#EEF2F8"
textColor = "#0F172A"
linkColor = "#3B5BDB"
borderColor = "#E3E7EF"
showWidgetBorder = true
showSidebarBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap, monospace"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "10px"
headingFontWeights = [800, 700, 650, 600, 600, 600]
dataframeHeaderBackgroundColor = "#F1F4F9"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F9"
borderColor = "#E6E9F0"
